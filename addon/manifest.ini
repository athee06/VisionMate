name = visionMate
summary = "VisionMate"
description = """Fast, fully offline image description. VisionMate describes the current element, the whole screen, or an image on the clipboard, on your own computer. Images are never sent to the internet.
NVDA+Alt+A: describe the current element
NVDA+Alt+F: describe the whole screen
NVDA+Alt+D: describe the clipboard image
NVDA+Alt+G: automatic descriptions of images without a label, on or off
Press twice for a detailed description in a window."""
author = "athiban"
version = 0.3.2
docFileName = readme.html
minimumNVDAVersion = 2024.1
lastTestedNVDAVersion = 2026.2
url = https://github.com/athee06/VisionMate
