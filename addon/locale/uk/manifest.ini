summary = "VisionMate"
description = """Швидкий, повністю автономний опис зображень та доступне накладання вікон, які NVDA не може прочитати. Усе працює на вашому комп’ютері. Зображення ніколи не надсилаються в Інтернет.
NVDA+Alt+A: описати поточний елемент
NVDA+Alt+W: опис поточного вікна
NVDA+Alt+F: опис усього екрана
NVDA+Alt+D: опис зображення у буфері обміну
У разі фото в чаті або файлу зображення в Провіднику файлів комбінація NVDA+Alt+A описує саме фото.
Натисніть двічі, щоб отримати детальний опис у діалозі, де ви можете задавати питання щодо зображення.
NVDA+Alt+O: накладання — текстовий список та піктограми вікна; клавіша Enter вибирає елемент
NVDA+Alt+G: увімкнення або вимкнення автоматичного опису зображень без підписів
NVDA+Alt+B: увімкнення або вимкнення назв для кнопок без підписів
NVDA+Alt+N: присвоєння власної назви кнопці або елементу накладання"""
